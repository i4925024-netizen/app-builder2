<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:sans-serif;margin:0;background:#f5f7fb;color:#172033}header{padding:16px;background:#172033;color:white}button{padding:10px;margin:4px;border:0;border-radius:8px}textarea{width:100%;height:42vh;box-sizing:border-box;font:14px monospace;padding:12px}iframe{width:100%;height:35vh;border:1px solid #ccd3df;background:white}.row{padding:8px}</style></head>
<body><header><b>HTML APK Studio</b><div>Project Editor • Preview • Build Provider</div></header>
<div class="row"><button onclick="preview()">Preview</button><button onclick="save()">Save</button><button onclick="build()">Build APK</button><button onclick="nativeMsg()">Native Test</button></div>
<textarea id="code"><!doctype html><html><body><h1>Hello from my app</h1><p>Edit this HTML and press Preview.</p></body></html></textarea>
<iframe id="preview"></iframe>
<script>
function preview(){document.getElementById('preview').srcdoc=document.getElementById('code').value}
function save(){localStorage.setItem('project-index',document.getElementById('code').value); if(window.Android) Android.showMessage('Project saved')}
function build(){if(window.Android) Android.requestBuild(document.getElementById('code').value); else alert('Configure a build provider in the native app')}
function nativeMsg(){if(window.Android) Android.showMessage('Native bridge is working')}
let old=localStorage.getItem('project-index'); if(old) code.value=old; preview();
</script></body></html>
