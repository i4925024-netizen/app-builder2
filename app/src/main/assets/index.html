<!doctype html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML to APK Builder 2.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f5f9;color:#17212f}
header{background:#101828;color:#fff;padding:17px}h1{margin:0;font-size:24px}header p{margin:5px 0;color:#cbd5e1}
nav{display:flex;gap:6px;padding:8px;background:#fff;border-bottom:1px solid #d9dee8;overflow:auto;position:sticky;top:0;z-index:5}
button{border:0;border-radius:9px;padding:10px 13px;background:#e7eaf0;font-size:14px}
.primary{background:#5b4bdb;color:#fff}.danger{background:#fee4e2;color:#b42318}
main{max-width:1050px;margin:auto;padding:12px}.screen{display:none}.screen.active{display:block}
.card{background:#fff;border:1px solid #d9dee8;border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.row{display:flex;gap:7px;flex-wrap:wrap}
label{font-size:12px;color:#667085;display:block;margin:5px 0}
input,select{width:100%;padding:10px;border:1px solid #ccd2dc;border-radius:8px}
textarea{width:100%;height:50vh;background:#0b1220;color:#e5e7eb;border-radius:9px;padding:12px;font:13px/1.5 Consolas}
iframe{width:100%;height:50vh;border:1px solid #d9dee8;border-radius:9px}
.file{padding:10px;border:1px solid #d9dee8;border-radius:9px;margin-top:7px}.small{font-size:12px;color:#667085}
.status{padding:10px;background:#eef4ff;color:#194185;border-radius:9px;margin-top:10px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>HTML to APK Builder 2.0</h1><p>Direct HTML → APK • No GitHub required</p></header>
<nav>
<button onclick="page('project')">Project</button>
<button onclick="page('editor')">Editor</button>
<button onclick="page('preview')">Preview</button>
<button onclick="page('settings')">APK Settings</button>
<button class="primary" onclick="build()">Build APK</button>
</nav>
<main>
<section id="project" class="screen active"><div class="card"><h2>Project</h2>
<div class="row">
<button class="primary" onclick="newProject()">+ New Project</button>
<button onclick="nativePick()">Import HTML</button>
<button onclick="nativeZip()">Import Web ZIP</button>
<button onclick="saveProject()">Save</button>
</div><div id="projectInfo"></div></div></section>

<section id="editor" class="screen"><div class="card"><h2>Web Files</h2>
<div class="row"><button onclick="addFile()">Add File</button><button onclick="renameFile()">Rename</button><button class="danger" onclick="deleteFile()">Delete</button></div>
<div id="fileList"></div><textarea id="code"></textarea><div class="small">Changes are saved automatically.</div></div></section>

<section id="preview" class="screen"><div class="card"><h2>Preview</h2><button onclick="preview()">Refresh</button><iframe id="previewFrame"></iframe></div></section>

<section id="settings" class="screen"><div class="card"><h2>APK Settings</h2>
<div class="grid">
<div><label>App name</label><input id="appName"></div>
<div><label>Package name</label><input id="packageName"></div>
<div><label>Version</label><input id="version"></div>
<div><label>Version code</label><input id="versionCode" type="number"></div>
<div><label>Orientation</label><select id="orientation"><option value="unspecified">Auto</option><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div>
<div><label>JavaScript</label><select id="js"><option value="1">Enabled</option><option value="0">Disabled</option></select></div>
<div><label>DOM Storage</label><select id="dom"><option value="1">Enabled</option><option value="0">Disabled</option></select></div>
<div><label>Internet permission</label><select id="internet"><option value="1">Enabled</option><option value="0">Offline</option></select></div>
</div>
<div class="row" style="margin-top:10px"><button class="primary" onclick="saveProject()">Save Settings</button><button onclick="build()">Build APK</button></div>
<div id="status" class="status">Ready</div></div>
<div class="card"><h2>Build History</h2><div id="history"></div></div>
</section>
</main>
<script>
const KEY="html-apk-20";let state,current="index.html",timer;
const starter={
"index.html":"<!doctype html><html><head><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><link rel=\"stylesheet\" href=\"style.css\"></head><body><h1>My App</h1><p>HTML to APK Builder 2.0</p><button onclick=\"hello()\">Test</button><script src=\"script.js\"><\/script></body></html>",
"style.css":"body{font-family:Arial;margin:30px;text-align:center}button{padding:12px 20px;border:0;border-radius:9px;background:#5b4bdb;color:white}",
"script.js":"function hello(){alert('Your HTML app is working!')}"
};
function fresh(){return{name:"My App",packageName:"com.example.myapp",version:"1.0.0",versionCode:1,orientation:"unspecified",js:1,dom:1,internet:1,files:{...starter},history:[]}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.files)return x}catch(e){}return fresh()}
function store(){localStorage.setItem(KEY,JSON.stringify(state))}
function page(id){sync();document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");if(id==="preview")preview();if(id==="editor")renderFiles()}
function sync(){state.files[current]=code.value;state.name=appName.value.trim()||state.name;state.packageName=packageName.value.trim()||state.packageName;state.version=version.value.trim()||state.version;state.versionCode=parseInt(versionCode.value)||1;state.orientation=orientation.value;state.js=+js.value;state.dom=+dom.value;state.internet=+internet.value;store()}
function fill(){appName.value=state.name;packageName.value=state.packageName;version.value=state.version;versionCode.value=state.versionCode;orientation.value=state.orientation;js.value=state.js;dom.value=state.dom;internet.value=state.internet}
function render(){projectInfo.innerHTML='<div class="file"><b>'+esc(state.name)+'</b><br><span class="small">'+esc(state.packageName)+' • v'+esc(state.version)+'</span></div>'}
function renderFiles(){fileList.innerHTML=Object.keys(state.files).map(f=>'<button onclick="openFile('+JSON.stringify(f)+')" style="margin:5px">'+esc(f)+'</button>').join('')}
function openFile(f){sync();current=f;code.value=state.files[f]||"";renderFiles()}
function saveProject(){sync();render();toast("Saved")}
function newProject(){state=fresh();current="index.html";fill();store();render();openFile(current);page("editor");toast("New project created")}
function addFile(){let n=prompt("File name:");if(!n)return;if(state.files[n]!=null)return toast("File already exists");state.files[n]="";store();openFile(n)}
function renameFile(){let n=prompt("New name:",current);if(!n||n===current)return;if(state.files[n]!=null)return toast("File exists");sync();state.files[n]=state.files[current];delete state.files[current];current=n;store();openFile(n)}
function deleteFile(){if(Object.keys(state.files).length<2)return toast("Keep at least one file");if(confirm("Delete "+current+"?")){delete state.files[current];current=Object.keys(state.files)[0];store();openFile(current)}}
function preview(){sync();let h=state.files["index.html"]||"",c=state.files["style.css"]||"",j=state.files["script.js"]||"";h=h.replace(/<link[^>]+href=["']style\.css["'][^>]*>/i,"<style>"+c+"</style>");h=h.replace(/<script[^>]+src=["']script\.js["'][^>]*><\/script>/i,"<script>"+j+"<\/script>");previewFrame.srcdoc=h}
function build(){sync();status.textContent="Preparing direct APK build…";if(window.Android&&Android.buildApk)Android.buildApk(JSON.stringify(state));else {status.textContent="Build bridge not installed in this UI shell.";toast("Source ready for native build engine.")}}
function nativePick(){if(Android&&Android.pickHtml)Android.pickHtml()}
function nativeZip(){if(Android&&Android.pickWebProject)Android.pickWebProject()}
function nativeImport(name,text){let n=name.toLowerCase();let f=(n.endsWith(".html")||n.endsWith(".htm"))?"index.html":n;state.files[f]=text;current=f;store();openFile(f);page("editor");toast("Imported "+name)}
function toast(s){status.textContent=s;setTimeout(()=>{status.textContent="Ready"},2500)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
code.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>{sync()},500)});
state=load();fill();render();openFile(current);
</script></body></html>
