<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:sans-serif;margin:0;background:#f5f7fb;color:#172033}header{padding:16px;background:#172033;color:white}textarea,input{width:100%;box-sizing:border-box;padding:11px;margin:6px 0}textarea{height:38vh;font-family:monospace}.card{padding:12px}button{padding:10px;margin:4px;border:0;border-radius:8px}
</style></head><body><header><b>AI HTML APK Studio</b><div>Generate • Edit • Preview • Build</div></header>
<div class="card"><input id="prompt" placeholder="Describe the app you want..."><button onclick="generate()">Generate starter</button><button onclick="preview()">Preview</button><button onclick="build()">Build APK</button></div>
<textarea id="code"></textarea><iframe id="p" style="width:100%;height:30vh;border:1px solid #ccd3df"></iframe>
<script>
const starter='<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><h1>My App</h1><p>Generated project starter.</p></body></html>';
code.value=localStorage.getItem('ai-code')||starter;
function generate(){code.value='<!doctype html><html><body><h1>'+((prompt.value||'My App').replace(/[<>]/g,''))+'</h1><p>Starter generated locally. Connect an AI provider for full generation.</p></body></html>';save()}
function save(){localStorage.setItem('ai-code',code.value)}
function preview(){save();p.srcdoc=code.value}
function build(){save(); if(window.Android) Android.requestBuild(code.value)}
preview();
</script></body></html>
